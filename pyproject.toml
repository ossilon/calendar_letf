[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar_letf"
version = "0.1.0"
description = "Simulate 2x leveraged ETFs that reset leverage weekly, monthly or quarterly, and their daily-reset twins. Research tooling, not investment advice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "numba>=0.60",
    "matplotlib>=3.7",          # the study scripts draw their charts, and the test suite imports one of them
]

[tool.setuptools.packages.find]
include = ["calendar_letf*"]
